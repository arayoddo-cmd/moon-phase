<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>달 모양 관측소</title>
<meta name="description" content="달의 공전과 위상 변화를 3D 모형으로 관찰하고, 지구에서 보이는 달의 모양이 바뀌는 까닭을 찾는 수업 자료">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b1a; --panel:#111934; --line:#2a3768;
  --text:#eef2ff; --muted:#a9b4d8; --accent:#ffcf5a; --accent2:#7cc4ff;
  --ok:#5fe0a0; --bad:#ff8a8a; --chip:#1f2b5a; --chiph:#2b3a78;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6;min-height:100vh;-webkit-tap-highlight-color:transparent}
#app{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
h1,h2,h3,.title{font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.5px;margin:0}
h1{font-size:clamp(36px,6vw,58px);line-height:1.15}
h3{font-size:22px;margin-bottom:6px}
p{margin:.4em 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:#1b1400;border:0;border-radius:999px;padding:12px 24px;font-weight:700;font-size:17px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.small{padding:7px 14px;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
input{font:inherit;color:var(--text);background:#0b1230;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus{outline:2px solid var(--accent2);border-color:transparent}
label{display:block;font-weight:700;margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top .grow{flex:1}
.pill{background:var(--chip);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.pill b{color:var(--text)}

.intro{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:center;min-height:88vh}
.intro>*{min-width:0}
.intro-r{display:flex;flex-direction:column;gap:12px}
.kicker{color:var(--accent2);font-weight:700;margin:0;font-size:14px}
.lead{font-size:18px}
.lead b{color:var(--accent)}
@media (max-width:920px){.intro{grid-template-columns:1fr;min-height:auto}}

/* 3D 화면 */
.stage{position:relative;width:100%;height:min(66vh,640px);min-height:320px;border-radius:var(--r);overflow:hidden;background:#050914;border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
@media (max-width:920px){.stage{height:min(56vh,540px)}}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage canvas.ov{pointer-events:none}
.stage .hud{position:absolute;left:10px;top:10px;right:10px;pointer-events:none;font-size:15px;font-weight:700;line-height:1.4}
.stage .hud span{display:inline-block;background:#08102ecc;border:1px solid #ffffff26;border-radius:12px;padding:5px 12px}
.stage .hud span:empty{display:none}
.stage.big .hud{font-size:24px}
.stage .nogl{display:flex;align-items:center;justify-content:center;height:100%;padding:20px;text-align:center;color:var(--muted)}

.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.group{display:flex;gap:3px;flex-wrap:wrap;align-items:center;background:#0b1230;border:1px solid var(--line);border-radius:999px;padding:3px}
.group .lbl{font-size:13px;color:var(--muted);padding:0 6px 0 10px}
.chip{background:var(--chip);border:1.5px solid transparent;border-radius:999px;padding:6px 14px;font-size:15px;min-height:40px}
.chip:hover{background:var(--chiph)}
.chip.on{background:var(--accent2);color:#06142b;font-weight:700}
.chip.big{font-weight:700;padding:6px 20px}
.chip.play{background:var(--accent);color:#1b1400;font-weight:700}
.group .chip{min-height:36px;padding:4px 12px}
.group.months .chip{min-width:46px;padding:4px 8px}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--chip);border:1.5px solid transparent;border-radius:12px;padding:8px 14px;font-weight:700;font-size:15px}
.tab.on{border-color:var(--accent);color:var(--accent);background:var(--chiph)}
.lesson{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:14px;align-items:start}
.lesson>*{min-width:0}
@media (max-width:920px){.lesson{grid-template-columns:1fr}}
.concept ol{padding-left:22px;margin:8px 0}
.concept li{margin:10px 0;font-size:17px;line-height:2}
.blank{display:inline-block;min-width:54px;text-align:center;border:0;border-bottom:2.5px solid var(--accent);background:#ffcf5a14;color:var(--accent);padding:0 8px;margin:0 2px;font-weight:700;border-radius:6px 6px 0 0;line-height:1.6}
button.blank:not(.show){color:transparent}
.blank.ok{border-color:var(--ok);color:var(--ok)}
/* 수업 모드: TV로 함께 보도록 3D 화면을 크게, 정리 카드는 아래에 큰 글씨로 */
/* 수업 모드: 넓은 화면에서는 버튼을 관측 화면 오른쪽 세로 칸에 모아 스크롤 없이 조작해요 */
.cl-stage .stage{height:max(420px,calc(100vh - 200px))}
@media (min-width:1000px){
  .cl-stage{display:grid;grid-template-columns:minmax(0,1fr) clamp(250px,21vw,340px);gap:12px;align-items:start}
  .cl-stage .stage{height:max(420px,calc(100vh - 100px))}
  .cl-side{max-height:calc(100vh - 100px);overflow-y:auto;overflow-x:hidden;padding-right:2px}
  .cl-side .ctrl{flex-direction:column;align-items:stretch;margin:0 0 10px}
  .cl-side .ctrl>*{max-width:100%}
  .cl-side .group{border-radius:16px;padding:5px}
  .cl-side .group .lbl{flex-basis:100%;padding:2px 8px 4px}
  .cl-side .group .chip{flex:1 1 auto}
  .cl-side .ctrl>.chip,.cl-side .ctrl>button{width:100%}
  .cl-side input[type=range]{width:100%}
}
#app:has(.cl-stage){max-width:1880px}
.cl-stage .chip{font-size:17px;min-height:46px}
.cl-stage .group .chip{min-height:42px}
.concept.big{margin-top:16px}
.concept.big h3{font-size:clamp(24px,2.6vw,34px)}
.concept.big li{font-size:clamp(22px,2.4vw,32px);margin:12px 0}
.concept.big .ask{font-size:clamp(19px,1.9vw,26px)}
.ask{background:#1c2a5c;border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;margin-top:12px;font-size:15px}
.ask b{color:var(--accent)}

.mcards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:700px){.mcards{grid-template-columns:1fr}}
.mcard{display:flex;flex-direction:column;gap:8px}
.mcard .n{font-family:"Do Hyeon";color:var(--accent);font-size:15px}
.mcard.lock{opacity:.5}
.mcard .row{margin-top:auto}
.st-done{color:var(--ok);font-weight:700}
.check{list-style:none;padding:0;margin:6px 0 12px}
.check li{padding:3px 0}
.check li.ok{color:var(--ok)}
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-of-type{border-top:0}
.q.locked{opacity:.4}
.q .s{font-size:17px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{background:var(--chip);border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;font-size:15px}
.opt:hover{background:var(--chiph)}
.opt:disabled{cursor:default}
.opt.no{opacity:.35;text-decoration:line-through;pointer-events:none}
.opt.sel{background:var(--accent);color:#1b1400;border-color:var(--accent);opacity:1}
.opts.zod .opt{padding:5px 10px;font-size:14px}
.fb{font-size:15px;margin-top:6px}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
.fb.ex{color:var(--text);background:#16224a;border-radius:8px;padding:6px 10px}
.done{background:#173a2c;border:1px solid var(--ok);border-radius:12px;padding:12px 14px;margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.done b{flex:1;min-width:160px}
.done.retry{background:#3a2a14;border-color:#ffb02e}
.done.retry>span{flex-basis:100%;font-size:15px;line-height:1.5}
.done.retry>span b{flex:none;min-width:0}
.st-re{color:#ffb02e;font-weight:700}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stp{background:var(--chip);border:1.5px solid transparent;border-radius:999px;padding:5px 12px;font-size:14px}
.stp.on{border-color:var(--accent);color:var(--accent)}
.stp.ok::after{content:" ✓";color:var(--ok)}
.quiz{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.quiz>*{min-width:0}
@media (max-width:820px){.quiz{grid-template-columns:1fr}}
.quiz .q{border-top:0;padding:0}
svg.fig{width:100%;max-height:250px;border-radius:10px;background:#0b1230;display:block;margin-bottom:10px}
svg.fig.sq{max-height:440px}
.score{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:16px;margin:10px 0}
.score dt{color:var(--muted)}
.score dd{margin:0;font-weight:700}
details.tip{background:#13204a;border:1px solid #3d5bb0;border-radius:12px;padding:10px 14px;margin:10px 0}
details.tip summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:16px}
details.tip ol{margin:8px 0 0 20px;padding:0}details.tip li{margin:5px 0}
.ztbl{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px;font-size:13px;text-align:center}
.ztbl span{background:#0b1230;border-radius:6px;padding:4px 2px}.ztbl b{display:block;color:#ffd9a8;font-size:12px}
.boxq{background:#0b1230;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}

.tstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.tstats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted)}
.tstats b{display:block;font-family:"Do Hyeon";font-size:28px;color:var(--text)}
.tbl-wrap{overflow-x:auto}
.ttbl{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
.ttbl th,.ttbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
.ttbl th{color:var(--muted);font-weight:500}
.tok{color:var(--ok);font-weight:700}
/* 3차시: 달 모양 고르기 · 위상 띠 */
.opts.shapes .opt{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;padding:6px 8px;font-size:12.5px;min-width:86px}
.opts.shapes .opt svg{display:block}
.pstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px;text-align:center;font-size:12px}
.pstrip span{background:#0b1230;border-radius:8px;padding:4px 2px}
.pstrip b{display:block;color:#ffd9a8}
.pstrip svg{display:block;margin:2px auto}
.pstrip.p8{grid-template-columns:repeat(8,1fr)}

/* 마지막 게임: 달 카드 뒤집기 + 지구 포대 */
.ghud{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ghud .pill{font-size:16px;padding:6px 14px}
.gwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,1fr);gap:14px;align-items:start}
.gwrap>*{min-width:0}
@media (max-width:820px){.gwrap{grid-template-columns:1fr}}
.gq{font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-size:clamp(24px,3vw,34px);line-height:1.3;margin:0 0 8px;font-weight:400}
.gres{border-radius:14px;padding:14px 16px;margin:10px 0;font-size:18px}
.gres.ok{background:#173a2c;border:1px solid var(--ok)}
.gres.bad{background:#3a1c22;border:1px solid var(--bad)}
.gres b{font-family:"Do Hyeon";font-size:26px;font-weight:400;display:block}
.gres span{display:block;font-size:15px;color:var(--muted)}
.glegend{list-style:none;padding:0;margin:8px 0;font-size:16px}
.glegend li{padding:3px 0}
.gbig{font-family:"Do Hyeon";font-size:clamp(48px,8vw,80px);color:var(--accent);line-height:1.1}
/* 1단계 카드 */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:760px;margin:0 auto}
@media (max-width:620px){.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}
.card{display:block;width:100%;aspect-ratio:3/4;perspective:800px;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;color:inherit}
.card .in{display:block;position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.up .in,.card.ok .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line)}
.card .f{background:radial-gradient(circle at 50% 35%,#2b3a78,#111934);font-size:clamp(30px,5vw,46px)}
.card .b{background:#0b1230;transform:rotateY(180deg);padding:6px}
.card .b svg{width:72%;height:auto}
.card .b .nm{font-family:"Do Hyeon";font-size:clamp(20px,3vw,30px);color:var(--text);text-align:center;line-height:1.2}
.card .b small{color:#ffd9a8;font-size:14px}
.card.ok .b{border-color:var(--ok);box-shadow:0 0 0 3px #5fe0a055}
.card.no .b{border-color:var(--bad)}
/* 2·3단계 지구 포대 */
.gmz image{filter:brightness(1.6) contrast(1.12)} /* 게임 속 달 사진은 더 밝게 */
.gwrap.big{grid-template-columns:minmax(0,1.9fr) minmax(250px,1fr)}
.gboard svg{display:block;width:100%;max-height:calc(100vh - 150px);min-height:300px;margin:0 auto;border-radius:14px;background:#050914;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
@media (max-width:820px){.gwrap.big{grid-template-columns:1fr}.gboard svg{max-height:62vh}}
.gtime{display:flex;align-items:center;gap:10px;font-size:18px;margin-bottom:8px}.gtime b{color:var(--accent);font-family:"Do Hyeon";font-size:26px;font-weight:400}
.gtime .gbar{flex:1;height:14px;background:#0b1230;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.gtime .gbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff8a3d,var(--accent))}
.sunnote{display:inline-block;border-radius:8px;padding:1px 8px;background:#3a2a06;color:#ffe08a}.sunnote.flash{animation:sunfl .3s 6 alternate}
@keyframes sunfl{to{background:#ffcf5a;color:#2a1c00}}
.gres.small{display:flex;gap:10px;align-items:center;padding:10px 12px}.gres.small b{font-size:20px}.fbic svg{display:block}
.tgt{display:flex;align-items:center;gap:14px;background:#0b1230;border:2px solid var(--accent);border-radius:14px;padding:10px 14px;margin:6px 0 10px}
.tgt svg{flex:none}
.tgt b{font-family:"Do Hyeon";font-size:clamp(22px,2.6vw,30px);font-weight:400;color:var(--accent)}
.seen{display:flex;align-items:center;gap:12px;margin-top:6px}
/* 교사 화면: 반 대항 막대 */
.dbars{display:grid;gap:8px;margin-top:8px}
.dbar{display:grid;grid-template-columns:minmax(90px,140px) 1fr 56px 64px;gap:10px;align-items:center;font-size:16px}
.dbar .dt{height:20px;background:#0b1230;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.dbar .dt i{display:block;height:100%;background:linear-gradient(90deg,#3d7bd9,#7cc4ff)}
.sndbtn{position:fixed;right:14px;bottom:14px;z-index:60;width:50px;height:50px;border-radius:50%;background:rgba(17,25,52,.92);border:1px solid var(--line);color:#fff;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 4px 16px #0009}
.sndbtn:hover{border-color:var(--accent)}.sndbtn.off{opacity:.65}.sndbtn[hidden]{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';
/* ───────── 설정 ─────────
   SUBMIT_URL: 태양계 탐사대·일주운동·연주운동과 같은 Apps Script 주소. 결과는 같은 구글 시트의 '달의 위상 현황' 탭에 모여요. */
const CONFIG = {
  SUBMIT_URL: 'https://script.google.com/macros/s/AKfycbwgcIJOTfz5PJHlA4DWjsth69Wyt_SMK7ea1NpXJUUEUCmBmyYRkA0Vpjh5du_2SHI/exec',
  LESSON: '달의 위상'
};
const D2R = Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = d => ((d % 360) + 360) % 360;

/* ───────── 달의 위상 ─────────
   th: 삭 위치에서 달이 공전한 각(°). 햇빛은 오른쪽(+x)에서 오고, 북극 위에서 보면 달은 시계 반대 방향으로 돌아요.
   th = 0 삭, 90 상현, 180 망, 270 하현. 음력 날짜는 위상 변화 주기 29.5일로 어림해요. */
function phName(th) {
  const n = norm(th);
  if (n < 10 || n >= 350) return '삭';
  if (n < 80) return '초승달';
  if (n <= 100) return '상현달';
  if (n < 170) return '상현달과 보름달 사이';
  if (n <= 190) return '보름달 (망)';
  if (n < 260) return '보름달과 하현달 사이';
  if (n <= 280) return '하현달';
  return '그믐달';
}
const lunarDay = th => Math.floor(1 + norm(th) / 360 * 29.5);

let clipN = 0;
/* 지구에서 본 달 모양의 밝은 부분 (반지름 1인 원). 오른쪽이 밝으면 차오르는 달, 왼쪽이 밝으면 작아지는 달.
   밝은 쪽 가장자리 반원 + 명암 경계(가로 반지름 cos th인 반타원)로 둘러싼 모양이에요. */
function phasePts(th) {
  const t = norm(th) * D2R, s = Math.sin(t) >= -1e-9 ? 1 : -1, k = Math.cos(t), p = [];
  for (let a = -90; a <= 90; a += 6) p.push([s * Math.cos(a * D2R), Math.sin(a * D2R)]);
  for (let a = 90; a >= -90; a -= 6) p.push([s * k * Math.cos(a * D2R), Math.sin(a * D2R)]);
  return p;
}
const isNew = th => Math.cos(norm(th) * D2R) > 0.985;
function phaseSVG(cx, cy, r, th) {
  const pts = phasePts(th).map(([x, y]) => `${(cx + x * r).toFixed(2)},${(cy + y * r).toFixed(2)}`).join(' ');
  const id = 'mclip' + (++clipN);
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#2b3150" stroke="#9aa7d6" stroke-width="${(r * 0.05).toFixed(2)}"${isNew(th) ? ` stroke-dasharray="${(r * 0.18).toFixed(2)} ${(r * 0.14).toFixed(2)}"` : ''}/><clipPath id="${id}"><polygon points="${pts}"/></clipPath><image href="${MOON_URL}" x="${cx - r}" y="${cy - r}" width="${2 * r}" height="${2 * r}" preserveAspectRatio="none" clip-path="url(#${id})"/>`;
}
const phaseIcon = (th, size) => `<svg viewBox="-1.15 -1.15 2.3 2.3" width="${size}" height="${size}" aria-hidden="true">${phaseSVG(0, 0, 1, th)}</svg>`;

function flipCard(i) {
  if (!G || G.stage !== 0 || G.phase !== 'play' || G.lock) return;
  const c = G.cards[i]; if (!c || c.up || c.ok) return;
  c.up = true; BGM.sfx('tick'); cardDraw();
  const up = G.cards.filter(x => x.up && !x.ok); if (up.length < 2) return;
  G.flips++;
  const [a, b] = up;
  if (a.k === b.k) {
    a.ok = b.ok = true; a.up = b.up = false; BGM.sfx('ok');
    G.msg = { h: `⭕ ${a.nm}`, s: `음력 ${a.d} 무렵의 달이에요.` };
    cardDraw();
    if (G.cards.every(x => x.ok)) {
      const pts = Math.max(100, 600 - 50 * (G.flips - 6)); G.score += pts;
      G.msg = { h: `🎉 모두 찾았어요! +${pts}`, s: `${G.flips}번 만에 찾았어요. (가장 적게는 6번)` };
      gTO = setTimeout(() => { G.phase = 'res'; render(); }, 700);

    const p = state.m3.pred || (state.m3.pred = { no: [] }), j = +t.dataset.j; if (p.ok) return;
    if (j === M3P.a) { p.ok = true; ui.fb.pred = { ok: true, msg: p.no.length ? '✔ 맞아요! 직접 보고 찾았어요.' : '🎯 예측 성공! 화면에서 확인해 보세요.' }; }
    else { if (!p.no.includes(j)) p.no.push(j); ui.fb.pred = { ok: false, msg: '🤔 예측과 실제를 비교해 보세요. 달이 날마다 어느 쪽으로 가고 모양이 어떻게 바뀌는지 보고 다시 골라요.' }; }
    Stage.set({ view: 'sky' }); Stage.playSky();
    save(); render();
  }
  else if (a === 'teacher') { ui.teacher = null; state.view = 'teacher'; render(); }
  else if (a === 'tload') teacherLoad();
  else if (a === 'tcls') { ui.teacher.cls = t.dataset.c; render(); }
  else if (a === 'submit') submit();
});
async function startMission(btn) {
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const num = val('num'), name = val('name'), msg = document.getElementById('introMsg');
  if (!num || !name) { msg.textContent = '학번과 이름을 모두 입력해 주세요.'; return; }
  if (CONFIG.SUBMIT_URL) {
    const code = val('ccode');
    if (!code) { msg.textContent = '수업 코드도 입력해 주세요.'; return; }
    msg.textContent = '수업 코드를 확인하는 중…'; btn.disabled = true;
    try {
      const out = await post({ lesson: CONFIG.LESSON, action: 'check', code });
      if (!out.ok) { msg.textContent = '수업 코드가 맞지 않아요. 다시 확인해 주세요.'; btn.disabled = false; return; }
    } catch (err) { /* 인터넷이 잠시 안 되면 일단 시작하고, 나중에 다시 보내요 */ }
    state.code = code;
  }
  state.num = num; state.name = name;
  // 선생님 시험용: 학번 00000이면 모든 임무·게임이 열린 임무 목록으로 (시트 보내기 시험은 📋 결과에서)
  enter('map');
}

/* ───────── 선생님께 진행 상황 보내기 (시트 '달의 위상 현황' 탭, 학생 한 명당 한 줄) ───────── */
async function post(body) {
  const res = await fetch(CONFIG.SUBMIT_URL, { method: 'POST', body: JSON.stringify(body) });
  return res.json();
}
async function hello() {
  if (ui.server != null) return ui.server;
  const out = await post({ action: 'hello' });
  ui.server = !!(out && out.lessons);
  return ui.server;
}
const COLS = ['임무 1 달의 공전', '임무 2 모형 관찰', '임무 3 순서와 저녁 하늘', '임무 4 확인 퀴즈', '공전 문제 (한 번에)', '모형 관찰 (한 번에)', '순서·저녁 하늘 (한 번에)', '확인 퀴즈 (한 번에)', '틀린 답'];
function progressVals() {
  // 통과/재도전 필요와 재도전 횟수도 함께 보내요 (한 번에 맞힌 수는 지금 도전의 기록)
  const stat = (done, a, b, i) => (done ? (passed(i) ? '완료' : '재도전 필요') : a ? `진행 ${a}/${b}` : '-') + (tries(i) ? ` (재도전 ${tries(i)}번)` : '');
  const posCnt = POS.filter((p, i) => posOk(i)).length;
  const wrong = [];
  POS.forEach(([n], i) => { const r = state.m2.s[i]; if (r && r.no.length) wrong.push(`${n}: ${r.no.map(j => SHAPES[j][1]).join(', ')}`); });
  if (state.m3.pred && state.m3.pred.no.length) wrong.push('예측: ' + state.m3.pred.no.map(j => M3P.o[j]).join(', '));
  return [
    stat(MISSIONS[0].done(), okCount(M1Q, state.m1.q), M1Q.length, 0), stat(MISSIONS[1].done(), posCnt + okCount(M2Q, state.m2.q), 8 + M2Q.length, 1),
    stat(MISSIONS[2].done(), okCount(M3Q, state.m3.q), M3Q.length, 2), stat(MISSIONS[3].done(), okCount(QUIZ, state.m4.q), QUIZ.length, 3),
    `${firstOk(M1Q, state.m1.q)}/${M1Q.length}`, `${posFirst() + firstOk(M2Q, state.m2.q)}/${8 + M2Q.length}`, `${firstOk(M3Q, state.m3.q)}/${M3Q.length}`, `${firstOk(QUIZ, state.m4.q)}/${QUIZ.length}`, wrong.join(' / ')
  ];
}
async function sync(force) {
  if (!CONFIG.SUBMIT_URL || !state.code || !state.num) return null;
  const vals = progressVals(), sig = [state.num, state.name].concat(vals).join('|');
  if (!force && sig === state.sentSig) return null;
  try {
    if (!(await hello())) return { ok: false, error: 'server' };
    const out = await post({ lesson: CONFIG.LESSON, action: 'save', code: state.code, num: state.num, name: state.name, cols: COLS, vals });
    if (out.ok) { state.sentSig = sig; state.sent = true; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
    return out;
  } catch (err) { return { ok: false, error: 'net' }; }
}
async function submit() {
  if (!state.code) { ui.submitMsg = '수업 코드 없이 시작해서 보낼 수 없어요. 처음 화면에서 다시 시작해 주세요.'; render(); return; }
  ui.submitMsg = '보내는 중…'; render();
  const out = await sync(true);
  ui.submitMsg = out && out.ok ? '✔ 선생님께 보냈어요.' : out && out.error === 'code' ? '수업 코드가 맞지 않아요.' : out && out.error === 'server' ? '아직 결과를 받을 준비가 안 됐어요. 선생님께 알려 주세요. (이 화면을 캡처해서 내도 돼요)' : '인터넷 연결을 확인해 주세요. 계속 안 되면 이 화면을 캡처해서 내세요.';
  render();
}

enter('intro');
